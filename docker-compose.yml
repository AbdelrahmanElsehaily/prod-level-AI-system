services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/chatapi
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=development
      # --- Ollama cloud (recommended) ---
      # Point at Ollama's cloud API and use a :cloud model.
      # Get a key at: https://ollama.com/settings/keys
      - OLLAMA_BASE_URL=https://ollama.com
      - OLLAMA_MODEL=kimi-k2.5:cloud
      # OLLAMA_API_KEY is read from .env (never hardcode secrets in compose files)
    env_file:
      # .env is git-ignored. Copy .env.example → .env and fill in OLLAMA_API_KEY.
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatapi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
