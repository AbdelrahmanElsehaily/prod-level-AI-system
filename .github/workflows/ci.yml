name: CI

# When does this workflow run?
#
# on: pull_request        → every time a PR is opened, updated, or reopened
# branches: [develop, main] → only for PRs targeting these branches
#
# This means a PR from feat/x → develop triggers CI.
# A PR from develop → main also triggers CI (double-check before release).
# A branch push with no PR does NOT trigger this workflow.
on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: lint
  # ---------------------------------------------------------------------------
  # Fast static analysis — no services, no DB, no network.
  # Runs first because it's the cheapest check. If the code has syntax errors,
  # import issues, or type violations, there's no point spinning up Postgres.
  #
  # Three tools in order:
  #   ruff check  — linting (unused imports, naming conventions, code style)
  #   ruff format — formatting (consistent indentation, quote style, line wraps)
  #   mypy        — static type checking (catches type mismatches at CI time,
  #                 not at runtime when a user hits the bug)
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      # ruff check: linting rules (E, F, I, N, W, UP — see pyproject.toml)
      # --output-format=github formats errors as GitHub annotations that appear
      # inline on the PR diff — engineers see the error next to the offending line.
      - name: Lint with ruff
        run: uv run ruff check . --output-format=github

      # ruff format --check: exits non-zero if any file would be reformatted.
      # Does NOT modify files — just reports what needs changing.
      # This enforces consistent formatting without a pre-commit hook in CI.
      - name: Check formatting with ruff
        run: uv run ruff format --check .

      # mypy: static type checking with strict mode (see pyproject.toml).
      # We only check app/ — tests use MagicMock extensively which mypy struggles
      # with in strict mode, and catching type errors in production code is the goal.
      - name: Type check with mypy
        run: uv run mypy app/

  # ---------------------------------------------------------------------------
  # Job 2: unit-tests
  # ---------------------------------------------------------------------------
  # Runs fast, in-memory tests with no external services.
  # Needs lint to pass first — no point running tests if the code won't parse.
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]  # Only run if lint passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      # Unit tests need NO environment variables — all dependencies are mocked.
      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Job 3: integration-tests
  # ---------------------------------------------------------------------------
  # Runs tests that require REAL Postgres and Redis.
  # The AI provider (Ollama) is still mocked — we never make real AI calls in tests.
  #
  # `needs: [unit-tests]` means this job only starts after unit-tests passes.
  # Why gate it? Integration tests spin up Docker services and take longer.
  # If unit tests are already broken, fail fast and save the CI minutes.
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]

    # Service containers: GitHub spins these up as Docker containers BEFORE
    # any steps run. They share a Docker network with the runner, so your code
    # reaches them at localhost:<port> — exactly like local dev.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/chatapi
      REDIS_URL: redis://localhost:6379
      ENVIRONMENT: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      # `|| [ $? -eq 5 ]` treats "no tests collected" (exit code 5) as a pass.
      # integration/ has no test files yet — they will be added as needed.
      - name: Run integration tests
        run: uv run pytest tests/integration/ -v --tb=short || [ $? -eq 5 ]

  # ---------------------------------------------------------------------------
  # Job 4: build
  # ---------------------------------------------------------------------------
  # Builds the production Docker image and runs a smoke test against /health.
  # This catches problems that only appear in the containerised environment:
  #   - Missing files not included by Dockerfile COPY
  #   - Import errors that only surface when the full image runs
  #   - Migration failures against a real Postgres
  #   - Startup crashes that unit tests (which mock everything) would never see
  #
  # Runs after integration-tests — we want all tests green before spending
  # time on a Docker build.
  build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [integration-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # docker compose is available on ubuntu-latest runners by default.
      # We use docker-compose.test.yml (not docker-compose.yml) which:
      #   - Builds the image from the Dockerfile
      #   - Starts Postgres, Redis, and the API
      #   - Has a healthcheck on the API container so we can wait for readiness
      - name: Build and start services
        run: docker compose -f docker-compose.test.yml up --build -d

      # Wait until the api container's healthcheck reports "healthy".
      # The healthcheck pings /health every 5s with up to 12 retries (60s total).
      # Without this wait, the curl below might hit the container before uvicorn
      # has finished starting or before migrations have completed.
      - name: Wait for API to be healthy
        run: |
          echo "Waiting for API container to become healthy..."
          for i in $(seq 1 24); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' \
              $(docker compose -f docker-compose.test.yml ps -q api) 2>/dev/null || echo "starting")
            echo "  Attempt $i/24: status = $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "API is healthy!"
              break
            fi
            if [ $i -eq 24 ]; then
              echo "API failed to become healthy after 120 seconds"
              docker compose -f docker-compose.test.yml logs api
              exit 1
            fi
            sleep 5
          done

      # Smoke test: a real HTTP request to /health confirms:
      #   1. The container started without crashing
      #   2. Migrations ran successfully (tables exist)
      #   3. The app can connect to Postgres and Redis
      #   4. The response is valid JSON with status=healthy
      #
      # -sf: silent mode + fail on non-2xx status codes.
      # If /health returns 503 (degraded), curl exits non-zero and CI fails.
      - name: Smoke test — GET /health returns 200
        run: |
          RESPONSE=$(curl -sf http://localhost:8000/health)
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"healthy"'

      # Always print logs on failure so we can debug without re-running CI.
      # `if: failure()` means this step only runs when a previous step failed —
      # it doesn't run on success (no log noise on green builds).
      - name: Print container logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Tear down
        if: always()  # run even if earlier steps failed — clean up the runner
        run: docker compose -f docker-compose.test.yml down -v
